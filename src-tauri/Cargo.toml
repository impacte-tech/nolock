[package]
name = "nolock"
version = "0.1.0"
edition = "2021"
# Tauri dev runs `cargo run nolock ...`; with both the app and the CLI binary
# present, cargo needs to know which one to run by default.
default-run = "nolock"

[build-dependencies]
tauri-build = { version = "=2.6.2", features = [] }

[dependencies]
tauri = { version = "=2.11.2", features = ["unstable", "image-png"] }
tauri-plugin-fs = "=2.5.1"
tauri-plugin-shell = "=2.3.5"
tauri-plugin-dialog = "=2.7.1"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
serde_yaml = "=0.9.34"
reqwest = { version = "=0.12.28", features = ["json", "stream"] }
futures = "0.3"
regex = "=1.11.1"
portable-pty = "=0.8.1"
keyring = "=2.3.3"
libc = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# NVIDIA NeMo Fabric — core config & runtime contracts for agents.
# Used to validate agent creation (typed config) and agent-to-agent flows
# (run planning, normalized results, artifact manifests, diagnostics).
nemo-fabric-core = "0.2.0"
# NVIDIA NeMo Switchyard — embeddable "general routers" (random, passthrough,
# llm-classifier) that pick which model/backend serves a request. nolock keeps
# its own transport; libsy only decides the target (see src/switchyard.rs).
switchyard-libsy = "0.2.0"
switchyard-protocol = "0.2.0"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd"))'.dependencies]
gtk = { version = "=0.18.2", features = ["v3_24"] }
wry = { version = "=0.55.1", default-features = false, features = ["protocol", "os-webview", "linux-body"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
block2 = "0.6"
